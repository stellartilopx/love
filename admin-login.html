<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Login · The Love Application</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="admin-mark" aria-hidden="true">♥</div>
    <p class="admin-kicker">Private access</p>
    <h1>Love Application</h1>
    <p class="login-copy">Enter the administrator password to view submitted applications.</p>
    <form id="loginForm">
      <label for="password">Administrator password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="login-error" id="loginError" role="alert"></p>
      <button class="admin-primary" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
